[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrace"
version = "0.1.0"
description = "SignalTrace Python package"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Matapo" }]
dependencies = ["PyYAML"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit", "pip-audit"]

[project.scripts]
signaltrace = "signaltrace.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
